<!DOCTYPE html>
<html>
<head>
    <title>ToDo List</title>
    <style>
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>My ToDo List</h1>

    <!-- 新しいタスクを追加する -->
    <form action="{{ url_for('add_task') }}" method="POST">
        <input type="text" name="task_name"
               placeholder="新しいタスクを入力" required>
        <button type="submit">追加</button>
    </form>

    <!-- 未完了のタスク一覧 -->
    <ul>
        {% for task in tasks %}
            {% if not task.done %}
                <li> 
                    <!-- チェックボックス -->
                    <form action="{{ url_for('complete_task', task_id=loop.index0) }}" method="POST">
                        <input type="checkbox" onchange="this.form.submit()">
                    </form>

                    {{task.name}}

                    <!-- 削除ボタン -->
                    <form action="{{ url_for('delete_task',task_id=loop.index0)}}" method="POST">
                            <button type="submit">削除</button>
                    </form>
                </li>
            {% endif %}
        {% endfor %}
    </ul>

    <!-- 完了したタスク一覧 -->
    <h2>完了</h2>
    <ul>
        {% for task in tasks %}
            {% if task.done %}
                <li>
                    {{ task.name }}

                    <!-- 戻すボタン -->
                    <form action="{{ url_for('undo_task', task_id=loop.index0) }}" method="POST">
                        <button type="submit">戻す</button>
                    </form>                  
                </li>
            {% endif %}
        {% endfor %}
    </ul>

    <!-- 削除したタスク一覧 -->
    <h2>削除済み</h2>
    <ul>
        {% for task in deleted_tasks %}
            <li>
                {{ task.name }}

                <!-- 復元ボタン -->
                <form action="{{ url_for('restore_task', task_id=loop.index0) }}" method="POST">
                    <button type="submit">元に戻す</button>
                </form>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
